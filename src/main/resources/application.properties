spring.application.name=MaqFlow-api

# LOCALE

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
#MYSQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
#JPAHIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
